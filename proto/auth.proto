syntax = "proto3";
package ecommerce;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenReply);
}

message RegisterRequest { string username = 1; string password = 2; string email = 3; string phone = 4; }
message RegisterReply   { int32 uid = 1; }
message LoginRequest    { string username = 1; string password = 2; }
message LoginReply      { string access_token = 1; int32 expires_in = 2; }
message VerifyTokenRequest { string token = 1; }
message VerifyTokenReply   { int32 uid = 1; string role = 2; }
