name: ecommerce-mvp

x-service: &service
  restart: unless-stopped
  init: true

services:
  # ======================= Hạ tầng =======================
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB}
    ports: ["15433:5432"]
    volumes: [auth-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB}"]
      interval: 5s
      retries: 10

  customer-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CUSTOMER_DB}
    ports: ["15434:5432"]
    volumes: [customer-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CUSTOMER_DB}"]
      interval: 5s
      retries: 10

  order-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_DB}
    ports: ["15435:5432"]
    volumes: [order-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDER_DB}"]
      interval: 5s
      retries: 10

  product-db:
    image: mongo:7
    ports: ["37018:27017"]
    volumes: [product-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  shipment-db:
    image: mongo:7
    ports: ["37019:27017"]
    volumes: [shipment-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["19092:9094"]   # cổng cho service chạy trực tiếp trên máy (npm start); trong Docker dùng kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ======================= Các service =======================
  # Chỉ api-gateway mở cổng ra máy; các service khác chỉ nói chuyện qua mạng nội bộ của Compose.
  auth-service:
    <<: *service
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      AUTH_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-db:5432/${AUTH_DB}
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-Shipper@123}
    depends_on:
      auth-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50051,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  customer-service:
    <<: *service
    build: { context: ., args: { SERVICE: customer-service } }
    environment:
      CUSTOMER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@customer-db:5432/${CUSTOMER_DB}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      customer-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50052,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  product-service:
    <<: *service
    build: { context: ., args: { SERVICE: product-service } }
    environment:
      PRODUCT_DB_URL: mongodb://product-db:27017
      MONGO_PRODUCT_DB: ${MONGO_PRODUCT_DB}
    depends_on:
      product-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50053,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      ORDER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/${ORDER_DB}
      KAFKA_BROKERS: kafka:9092
      CUSTOMER_ADDR: customer-service:50052
      PRODUCT_ADDR: product-service:50053
    depends_on:
      order-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50054,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  shipment-service:
    <<: *service
    build: { context: ., args: { SERVICE: shipment-service } }
    environment:
      SHIPMENT_DB_URL: mongodb://shipment-db:27017
      MONGO_SHIPMENT_DB: ${MONGO_SHIPMENT_DB}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      shipment-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(50055,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api-gateway:
    <<: *service
    build: { context: ., args: { SERVICE: api-gateway } }
    ports: ["18080:18080"]
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_ADDR: auth-service:50051
      CUSTOMER_ADDR: customer-service:50052
      PRODUCT_ADDR: product-service:50053
      ORDER_ADDR: order-service:50054
      SHIPMENT_ADDR: shipment-service:50055
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      shipment-service: { condition: service_healthy }
    healthcheck:
      # Chỉ kiểm tra cổng đã mở (không gọi /api/health vì nó phụ thuộc mọi service khác)
      test: ["CMD", "node", "-e", "require('net').connect(18080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  auth-data:
  customer-data:
  order-data:
  product-data:
  shipment-data:
